<!DOCTYPE html>
<html>
<head>
    <title>AI Inventory Chat</title>
</head>
<body>
    <h1>AI Inventory Assistant</h1>
    <a href="/">Back to Home</a>
    <hr>
    
    <h2>Ask the Inventory Manager</h2>
    <form method="POST" action="/chat">
        <label for="message">Your Question (e.g. 'How do I categorize laptops?'):</label><br>
        <textarea id="message" name="message" rows="5" cols="50" required></textarea><br><br>
        <input type="submit" value="Send to AI">
    </form>
    
    {% if error %}
        <p style="color:red;">Error: {{ error }}</p>
    {% endif %}
    
    {% if reply %}
        <hr>
        <h3>AI Assistant Reply:</h3>
        <pre>{{ reply }}</pre>
    {% endif %}
</body>
</html>
